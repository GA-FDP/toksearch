[build-system]
requires = ["setuptools", "numpy>=1.20,<2"]
build-backend = "setuptools.build_meta"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "toksearch/_version.py"
versionfile_build = "toksearch/_version.py"
# Two events, one version: fdp-core spec 2026-09-15 section 3. `staging-X.Y.Z`
# builds; `release-X.Y.Z` promotes those exact bytes and must NOT rebuild, so
# versioneer reads the staging tag.
tag_prefix = "staging-"
parentdir_prefix = "toksearch-"

[project]
name = "toksearch"
dynamic = ["version"]

[project.scripts]
toksearch = "toksearch.llm.cli:main"

[project.optional-dependencies]
llm = [
    "anthropic>=0.34",
    "openai>=1.50",
    "matplotlib",
    "claude-agent-sdk>=0.2",
    "mcp>=1.23,<2",
]

[project.entry-points."toksearch.llm.namespace"]
toksearch = "toksearch"

[project.entry-points."toksearch.llm.skills"]
toksearch = "toksearch.llm:CORE_SKILLS_DIR"
