context:
  version: ${{ env.get("PKG_VERSION") }}

package:
  name: toksearch
  version: ${{ version }}

source:
  path: ..

build:
  script:
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    # Build against numpy 2 headers: the extension then runs on 1.x and 2.x
    # (the reverse does not hold). numpy's run_export sets the runtime range.
    - numpy >=2
    - openblas
  # rattler-build 0.39 synthesises a python run-export of
  # `python 3.12.* *_debug_cpython` from a host python whose build string is
  # plainly `h5f976f7_2_cpython` -- no debug about it. Nothing on conda-forge
  # declares that export (the 3.12.14 builds declare none at all), and the
  # python_abi export beside it is correct, so this is a tool bug. The bad pin
  # makes the built package uninstallable: no such python exists.
  #
  # Ignore the synthesised python export and state the constraint ourselves.
  # python_abi still pins the ABI correctly, so the package stays
  # version-specific.
  ignore_run_exports:
    by_name:
      - python
  run:
    - python ${{ python }}
    - mdsplus-xrdcl >=1,<2
    # libMdsIpFDP.so, the transport MDSplus loads for an 'fdp://' location.
    # A protocol, not a device: DIII-D is served this way today and C-Mod is
    # next, so this is not DIII-D-specific plumbing riding along in core
    # toksearch. Without it, an fdp:// location fails at connect with
    # "Protocol FDP is not supported" on stderr and a bare "Error connecting"
    # exception -- which, inside a Pipeline worker, loses the useful half.
    #
    # It is built once per MDSplus provider; the mdsplus-xrdcl pin above selects
    # the matching variant.
    - mdsip-fdp >=0.1.0
    - fdp-schema >=0.1.1
    - numpy >=1.22,<3
    - pymssql
    - ray-core
    - pyspark >=4
    - scipy
    - sh
    - xarray
    - bottleneck
    - openblas
    - joblib >=1.3
    - jupyter
    - fsspec
    - zarr =3
    # toksearch.llm backends. anthropic + openai are the API providers;
    # claude-agent-sdk + mcp back the claude-max backend (uses the user's
    # Claude Max OAuth via the `claude` CLI). These mirror the `[llm]`
    # optional-dependency extra in pyproject.toml so conda installs get
    # the same surface as `pip install toksearch[llm]`.
    - anthropic >=0.34
    - openai >=1.50
    - claude-agent-sdk >=0.2
    - gradio >=4
    - mcp >=1.23,<2
    - matplotlib
    - plotly
    - python-kaleido

  # NOT a run dependency. toksearch is device-neutral and most of it never
  # touches a store; ptdata is imported lazily and a MAST-only install needs
  # none of it. But an older ptdata alongside this toksearch is silently
  # wrong rather than broken: compute() exports FDP_STORE_SNAPSHOT and
  # ptdata < 2.9.0 does not read FDP_STORE_CATALOG (it read the pre-B7b
  # FDP_STORE_SNAPSHOT), so every pin would be accepted, recorded
  # in the provenance, and ignored -- a run that says it read one snapshot
  # while reading whatever was newest.
  #
  # run_constraints is exactly this case: install nothing, but impose a floor
  # if the package is present at all. The solver is the only protection,
  # because nothing at runtime can tell an ignored pin from an honoured one.
  run_constraints:
    - ptdata >=2.9.0

tests:
  # setup.py builds no extension when numpy is missing at build time, and the
  # package would ship without ell1module. Fail the build instead.
  - python:
      imports:
        - toksearch.library.ell1module
      pip_check: false
  - script:
      content:
        - cd tests && ./testit
    requirements:
      run:
        - openjdk >=17
        # the snapshot tests import SqlSnapshotLocator at module level; test-only, the run dep on fdp-schema is unchanged
        - fdp-schema >=0.3.0
        # The snapshot reader's stack, so its tests run instead of skipping.
        # macOS loads DuckDB's own signed httpfs (conda-forge's osx-arm64
        # package cannot be installed), so the extension package is Linux-only.
        - python-duckdb >=1.5,<2
        - sqlglot >=30
        - if: linux
          then: duckdb-extension-httpfs >=1.5,<2
    files:
      source:
        - tests/

about:
  homepage: https://github.com/GA-FDP/toksearch
  license: Apache-2.0
  license_file: LICENSE
  summary: Data pipeline framework for fusion experimental data
  repository: https://github.com/GA-FDP/toksearch

extra:
  recipe-maintainers:
    - sammuli
