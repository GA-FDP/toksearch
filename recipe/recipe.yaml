context:
  version: ${{ env.get("PKG_VERSION") }}

package:
  name: toksearch
  version: ${{ version }}

source:
  path: ..

build:
  script:
    - ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools
    - numpy >=1.20, <2
    - openblas
  # rattler-build 0.39 synthesises a python run-export of
  # `python 3.12.* *_debug_cpython` from a host python whose build string is
  # plainly `h5f976f7_2_cpython` -- no debug about it. Nothing on conda-forge
  # declares that export (the 3.12.14 builds declare none at all), and the
  # python_abi export beside it is correct, so this is a tool bug. The bad pin
  # makes the built package uninstallable: no such python exists.
  #
  # Ignore the synthesised python export and state the constraint ourselves.
  # python_abi still pins the ABI correctly, so the package stays
  # version-specific.
  ignore_run_exports:
    by_name:
      - python
  run:
    - python ${{ python }}
    - mdsplus-xrdcl >=1,<2
    # libMdsIpFDP.so, the transport MDSplus loads for an 'fdp://' location.
    # A protocol, not a device: DIII-D is served this way today and C-Mod is
    # next, so this is not DIII-D-specific plumbing riding along in core
    # toksearch. Without it, an fdp:// location fails at connect with
    # "Protocol FDP is not supported" on stderr and a bare "Error connecting"
    # exception -- which, inside a Pipeline worker, loses the useful half.
    #
    # It is built once per MDSplus provider; the mdsplus-xrdcl pin above selects
    # the matching variant.
    - mdsip-fdp >=0.1.0
    - fdp-schema >=0.1.1
    - numpy >=1.20, <2
    - pymssql
    - ray-core
    - pyspark >=4
    - scipy
    - sh
    - xarray
    - bottleneck
    - openblas
    - joblib >=1.3
    - jupyter
    - fsspec
    - zarr =3
    # toksearch.llm backends. anthropic + openai are the API providers;
    # claude-agent-sdk + mcp back the claude-max backend (uses the user's
    # Claude Max OAuth via the `claude` CLI). These mirror the `[llm]`
    # optional-dependency extra in pyproject.toml so conda installs get
    # the same surface as `pip install toksearch[llm]`.
    - anthropic >=0.34
    - openai >=1.50
    - claude-agent-sdk >=0.2
    - gradio >=4
    - mcp >=1.23,<2
    - matplotlib
    - plotly
    - python-kaleido

tests:
  - script:
      content:
        - cd tests && ./testit
    requirements:
      run:
        - openjdk >=17
    files:
      source:
        - tests/

about:
  homepage: https://github.com/GA-FDP/toksearch
  license: Apache-2.0
  license_file: LICENSE
  summary: Data pipeline framework for fusion experimental data
  repository: https://github.com/GA-FDP/toksearch

extra:
  recipe-maintainers:
    - sammuli
